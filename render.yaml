services:
  - type: web
    name: swebudd-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SWEBUDD_RENDER_ORIGIN_COMPAT
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ADMIN_JWT_ISSUER
        value: swebudd-admin
      - key: ADMIN_JWT_AUDIENCE
        value: swebudd-admin-moderation
      - key: FRONTEND_ORIGIN
        value: https://swebudd.com
      - key: ADMIN_ORIGIN
        # Compatibility alias for a deliberately redeployed v0.2.43 target,
        # which predates NATIVE_APP_ORIGIN. Current startup clears it.
        value: https://localhost
      - key: ALLOW_LOCAL_ORIGINS
        value: "false"
      - key: NATIVE_AUTH_ENABLED
        value: "true"
      - key: NATIVE_APP_ORIGIN
        value: https://localhost
      # Set true only to stop native CORS/session transport during an incident.
      - key: SWEBUDD_NATIVE_AUTH_EMERGENCY_DISABLED
        value: "false"
      # Temporary bridge for Android <=0.2.68, which predates native Turnstile.
      - key: LEGACY_NATIVE_AUTH_COMPAT_UNTIL
        value: "2026-10-01T00:00:00.000Z"
      # Temporary bridge for already-running pre-cookie browser bundles.
      - key: LEGACY_WEB_AUTH_COMPAT_UNTIL
        value: "2026-10-01T00:00:00.000Z"
      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false
      - key: MEDIA_STORAGE_DRIVER
        value: s3
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_QUARANTINE_S3_BUCKET
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: MEDIA_UPLOAD_WORKER_ENABLED
        value: "true"
      - key: MEDIA_LEGACY_PROXY_UPLOADS_ENABLED
        value: "false"
      - key: MEDIA_PROCESSING_TEMP_DIR
        value: /app/media-processing-tmp
      - key: MEDIA_UPLOAD_MAX_ACTIVE_PER_USER
        value: "3"
      - key: MEDIA_UPLOAD_ROLLING_QUOTA_BYTES
        value: "524288000"
      - key: MEDIA_UPLOAD_ROLLING_QUOTA_HOURS
        value: "24"
      - key: MEDIA_UPLOAD_PART_BYTES
        value: "8388608"
      - key: MEDIA_UPLOAD_SESSION_TTL_SECONDS
        value: "1800"
      - key: MEDIA_UPLOAD_URL_TTL_SECONDS
        value: "300"
      - key: MEDIA_UPLOAD_WORKER_CONCURRENCY
        value: "2"
      - key: MEDIA_UPLOAD_JOB_MAX_ATTEMPTS
        value: "5"
      - key: MEDIA_UPLOAD_JOB_LEASE_SECONDS
        value: "300"
      - key: MEDIA_UPLOAD_WORKER_POLL_MS
        value: "2000"
      - key: MEDIA_S3_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: MEDIA_S3_DOWNLOAD_TIMEOUT_MS
        value: "180000"
      - key: MEDIA_MULTIPART_COMPLETE_TIMEOUT_MS
        value: "120000"
      - key: MEDIA_UPLOAD_COMPLETION_STALE_SECONDS
        value: "300"
      - key: MEDIA_QUARANTINE_CLEANUP_TOMBSTONE_SECONDS
        value: "1800"
      - key: MEDIA_PUBLISH_TIMEOUT_MS
        value: "120000"
      - key: MEDIA_PUBLISH_CLEANUP_GRACE_SECONDS
        value: "1800"
      - key: MEDIA_PUBLISH_CLEANUP_TOMBSTONE_SECONDS
        value: "300"
      - key: MEDIA_PROCESSING_CONCURRENCY
        value: "2"
      - key: MEDIA_PROCESSING_MAX_QUEUE
        value: "16"
      - key: MEDIA_PROCESSING_STALE_TEMP_SECONDS
        value: "21600"
      - key: MEDIA_PROCESSING_STALE_CLEANUP_LIMIT
        value: "100"
      - key: MEDIA_MALWARE_SCANNER
        value: clamd-tcp
      - key: MEDIA_MALWARE_SCAN_TIMEOUT_MS
        value: "60000"
      # Provision this as a private-network ClamAV service; never expose 3310
      # publicly. The current free web-service blueprint cannot host a sidecar.
      - key: MEDIA_CLAMD_TCP_HOST
        sync: false
      - key: MEDIA_CLAMD_TCP_PORT
        value: "3310"
      - key: MEDIA_CLAMD_TRUSTED_NETWORK
        value: "true"
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_S3_FORCE_PATH_STYLE
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_IGNORE_TLS
        value: "false"
      - key: SMTP_REQUIRE_TLS
        value: "true"
      - key: SMTP_TLS_REJECT_UNAUTHORIZED
        value: "true"
      - key: MAIL_FROM
        sync: false
