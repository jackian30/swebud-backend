services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swebud}
      POSTGRES_USER: ${POSTGRES_USER:-swebud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong random value}
    volumes:
      - swebud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swebud

  db-roles:
    image: ${POSTGRES_HELPER_IMAGE:-postgres@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50}
    user: postgres
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_RUNTIME_USER: ${DATABASE_RUNTIME_USER:?Set the runtime database role}
      DATABASE_ADMIN_READONLY_USER: ${DATABASE_ADMIN_READONLY_USER:?Set the admin read-only database role}
      DATABASE_BACKUP_USER: ${DATABASE_BACKUP_USER:?Set the dedicated backup database role}
      DIRECT_URL_FILE: /run/secrets/database_owner_url
      DATABASE_RUNTIME_PASSWORD_FILE: /run/secrets/database_runtime_password
      DATABASE_ADMIN_READONLY_PASSWORD_FILE: /run/secrets/database_readonly_password
      DATABASE_BACKUP_PASSWORD_FILE: /run/secrets/database_backup_password
    secrets:
      - database_owner_url
      - database_runtime_password
      - database_readonly_password
      - database_backup_password
    volumes:
      - ./provision-database-roles.sh:/deployment/provision-database-roles.sh:ro
      - ./database-roles.sql:/deployment/database-roles.sql:ro
    command: /bin/sh /deployment/provision-database-roles.sh
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    networks:
      - swebud

  migrate:
    image: ${BACKEND_IMAGE:-swebud-backend:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SWEBUDD_SKIP_ENTRYPOINT_MIGRATIONS: "true"
      DIRECT_URL_FILE: /run/secrets/database_owner_url
    secrets:
      - database_owner_url
    command: >-
      sh -ceu 'DIRECT_URL="$$(cat "$$DIRECT_URL_FILE")";
      export DIRECT_URL;
      DATABASE_URL="$$DIRECT_URL";
      export DATABASE_URL;
      exec node scripts/deploy-migrations.js'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - swebud

  backend:
    image: ${BACKEND_IMAGE:-swebud-backend:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SWEBUDD_SKIP_ENTRYPOINT_MIGRATIONS: "true"
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the application database URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random value}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET to a different strong random value}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET to a third distinct strong random value}
      ADMIN_JWT_ISSUER: ${ADMIN_JWT_ISSUER:?Set ADMIN_JWT_ISSUER}
      ADMIN_JWT_AUDIENCE: ${ADMIN_JWT_AUDIENCE:?Set ADMIN_JWT_AUDIENCE}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      MINIMUM_ACCOUNT_AGE: ${MINIMUM_ACCOUNT_AGE:-18}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to the production frontend origin}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
      ALLOW_LOCAL_ORIGINS: ${ALLOW_LOCAL_ORIGINS:-false}
      NATIVE_AUTH_ENABLED: ${NATIVE_AUTH_ENABLED:-false}
      NATIVE_APP_ORIGIN: ${NATIVE_APP_ORIGIN:-}
      LEGACY_NATIVE_AUTH_COMPAT_UNTIL: ${LEGACY_NATIVE_AUTH_COMPAT_UNTIL:-}
      LEGACY_WEB_AUTH_COMPAT_UNTIL: ${LEGACY_WEB_AUTH_COMPAT_UNTIL:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST to a production SMTP service}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_IP_FAMILY: ${SMTP_IP_FAMILY:-4}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-20000}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM to a verified production sender}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:9000/auth/google/callback}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:?Set CLOUDFLARE_TURNSTILE_SECRET_KEY to the production secret}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      KLIPY_CLIENT_KEY: ${KLIPY_CLIENT_KEY:-swebud-local}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:?Set MEDIA_STORAGE_DRIVER=s3}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:?Set the public media bucket}
      MEDIA_S3_PREFIX: ${MEDIA_S3_PREFIX:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?Set the public media base URL}
      # Incoming files and transcoded outputs belong on this dedicated
      # disk-backed volume, never the memory-backed /tmp or public uploads.
      MEDIA_PROCESSING_TEMP_DIR: /app/media-processing-tmp
      MEDIA_UPLOAD_TEMP_DIR: /app/media-processing-tmp/incoming
      MEDIA_PROCESSING_CONCURRENCY: ${MEDIA_PROCESSING_CONCURRENCY:-2}
      MEDIA_PROCESSING_MAX_QUEUE: ${MEDIA_PROCESSING_MAX_QUEUE:-16}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN:-}
      GARMIN_CONSUMER_KEY: ${GARMIN_CONSUMER_KEY:-}
      GARMIN_CONSUMER_SECRET: ${GARMIN_CONSUMER_SECRET:-}
    command: sh -c "mkdir -p uploads/profile-photos uploads/cover-photos uploads/group-photos uploads/chat-photos uploads/actsnaps uploads/posts uploads/comments uploads/images uploads/videos uploads/audio uploads/media && exec node dist/src/main.js"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3002}:3000"
    volumes:
      - swebud_uploads:/app/uploads
      - swebud_media_processing_temp:/app/media-processing-tmp
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - swebud

networks:
  swebud:
    name: ${SWEBUD_NETWORK:-swebud}
    external: true

volumes:
  swebud_postgres_data:
  swebud_uploads:
  swebud_media_processing_temp:

secrets:
  database_owner_url:
    file: ${DATABASE_OWNER_URL_SECRET_FILE:-./.secrets/direct-url}
  database_runtime_password:
    file: ${DATABASE_RUNTIME_PASSWORD_SECRET_FILE:-./.secrets/runtime-password}
  database_readonly_password:
    file: ${DATABASE_ADMIN_READONLY_PASSWORD_SECRET_FILE:-./.secrets/readonly-password}
  database_backup_password:
    file: ${DATABASE_BACKUP_PASSWORD_SECRET_FILE:-./.secrets/backup-password}
