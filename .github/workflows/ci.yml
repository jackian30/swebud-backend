name: Backend CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          extra_args: --results=verified,unknown

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50 # PostgreSQL 16.13
        env:
          POSTGRES_DB: swebud_test
          POSTGRES_USER: swebud
          POSTGRES_PASSWORD: swebud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swebud -d swebud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://swebud:swebud@localhost:5432/swebud_test?schema=public
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret
      ADMIN_JWT_SECRET: ci-admin-secret-ci-admin-secret-ci-admin-secret
      ADMIN_JWT_ISSUER: swebudd-admin-ci
      ADMIN_JWT_AUDIENCE: swebudd-admin-moderation-ci
      FRONTEND_ORIGIN: http://localhost:9000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npm run prisma:deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm test -- --runInBand
      - run: npm run test:e2e
      - run: npm run lint
      - run: npm run build
      - run: npm run openapi:check
      - run: npm audit --omit=dev --audit-level=high

  supply-chain:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build production image
        run: docker build --pull --tag "swebudd-backend:${GITHUB_SHA}" .
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: swebudd-backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CycloneDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: swebudd-backend:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload production SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-sboms-${{ github.sha }}
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 30
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: swebudd-backend:${{ github.sha }}
          version: v0.72.0
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
